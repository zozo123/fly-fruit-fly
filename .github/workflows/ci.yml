name: CI
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/verify_results.py'
      - 'scripts/verify_flight_release.py'
      - 'media/**'
      - 'results/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/verify_results.py'
      - 'scripts/verify_flight_release.py'
      - 'media/**'
      - 'results/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MUJOCO_GL: egl
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa libgl1-mesa-dri ffmpeg
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Verify committed experiment evidence
        run: |
          python scripts/verify_results.py
          python scripts/verify_flight_release.py
      - name: Run simulator and unit tests
        run: pytest -q
