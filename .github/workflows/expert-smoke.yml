name: Expert flight validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expert-smoke.yml'
      - 'src/fly_fruit_fly/expert.py'
  pull_request:
    paths:
      - '.github/workflows/expert-smoke.yml'
      - 'src/fly_fruit_fly/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expert:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      MUJOCO_GL: egl
      OMP_NUM_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install simulator and SavedModel runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa libgl1-mesa-dri ffmpeg
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[expert,dev]'
          python -m pip freeze > environment.txt
      - name: Evaluate released expert on complete trajectories
        run: fly evaluate --expert --episodes 10 --seed 40000 --video --output runs/expert
      - name: Record fixed flight gate
        run: |
          fly assess runs/expert/metrics.json > runs/assessment.json
          cat runs/assessment.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expert-flight-${{ github.run_id }}
          path: |
            runs/
            environment.txt
          retention-days: 30
