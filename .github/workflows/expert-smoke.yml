name: Official Flybody expert

on:
  pull_request:
    paths:
      - '.github/workflows/expert-smoke.yml'
      - 'src/fly_fruit_fly/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expert:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install simulator and expert runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa libgl1-mesa-dri ffmpeg
          python -m pip install -e '.[expert]'
      - name: Verify released expert end to end
        run: |
          fly evaluate --expert --episodes 1 --seed 41000 --video --output runs/expert
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('runs/expert/metrics.json')
          data = json.loads(p.read_text())
          assert data['controller'] == 'official_flybody_expert'
          assert data['expert_archive_sha256'] == '2d9937c9af2baafad1690c1b318791bde417b4d26dd96d4385ab6723d5d58582'
          assert len(data['episodes']) == 1
          assert data['episodes'][0]['control_steps'] > 0
          assert Path('runs/expert/flight.mp4').stat().st_size > 0
          print(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-flybody-expert
          path: runs/expert
          if-no-files-found: warn
