name: Autonomous connectome student
on:
  push:
    branches: [main]
    paths:
      - 'src/fly_fruit_fly/flight_training.py'
      - '.github/workflows/flight-student.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flight-student-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MUJOCO_GL: egl
      OMP_NUM_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa libgl1-mesa-dri ffmpeg
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[superfly,dev]'
          pytest -q tests/test_flight_training.py tests/test_superfly.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fly-fruit-fly/banc-v888
          key: banc-v888-paper-v2
      - name: Train with autonomous validation and held-out evaluation
        run: |
          python -m fly_fruit_fly.flight_training --rounds 12 --output runs/student
          python -m pip freeze > runs/student/environment.txt
      - name: Apply unchanged flight gate
        run: fly assess runs/student/evaluation/metrics.json --require-pass
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-connectome-student
          path: runs/student
          retention-days: 30
          if-no-files-found: warn
