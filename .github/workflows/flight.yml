name: Flight baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      steps:
        description: PPO training steps (rounded up to a 512-step rollout)
        default: '1000000'
        required: true

permissions:
  contents: read

concurrency:
  group: flight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flight:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      OMP_NUM_THREADS: '2'
      TRAIN_STEPS: ${{ inputs.steps || '8192' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install renderer and CPU training dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa libgl1-mesa-dri ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
          python -m pip freeze > environment.txt
      - name: Test actual simulator
        run: |
          python -m pytest -q
          python scripts/verify_results.py
          fly assess results/2026-09-12-smoke/ppo.json --baseline results/2026-09-12-smoke/baseline.json
      - name: Measure untrained wingbeat baseline
        run: fly evaluate --episodes 3 --video --output runs/baseline
      - name: Train a small PPO controller
        run: fly train --steps "$TRAIN_STEPS" --output runs/train
      - name: Reload and evaluate checkpoint on held-out seeds
        run: fly evaluate --checkpoint runs/train --episodes 3 --video --output runs/evaluation
      - name: Report measured performance without claiming flight success
        run: fly assess runs/evaluation/metrics.json --baseline runs/baseline/metrics.json
      - name: Verify resumed training and checkpoint pairs
        run: |
          fly train --resume runs/train --steps 512 --checkpoint-every 512 --output runs/resumed
          python scripts/verify_resume.py runs/train runs/resumed
          fly evaluate --checkpoint runs/resumed --episodes 1 --output runs/resumed-evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flight-baseline-${{ github.sha }}
          path: |
            runs/
            environment.txt
          retention-days: 14
