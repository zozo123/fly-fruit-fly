name: Nonlinear connectome student
on:
  push:
    branches: [main]
    paths:
      - 'src/fly_fruit_fly/nonlinear_training.py'
      - '.github/workflows/nonlinear-student.yml'
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      MUJOCO_GL: egl
      OMP_NUM_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa libgl1-mesa-dri ffmpeg
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[superfly,dev]'
          pytest -q tests/test_nonlinear_training.py
      - uses: actions/download-artifact@v4
        with:
          name: autonomous-connectome-student
          run-id: 34747591540
          github-token: ${{ github.token }}
          path: runs/warm
      - name: Train nonlinear decoder and test independently
        run: |
          python -m fly_fruit_fly.nonlinear_training --checkpoint runs/warm/student.pt --graph runs/warm/graph.npz --output runs/nonlinear
          python -m pip freeze > runs/nonlinear/environment.txt
      - name: Apply flight gate
        run: fly assess runs/nonlinear/evaluation/metrics.json --require-pass
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonlinear-connectome-student
          path: runs/nonlinear
          retention-days: 30
