name: Nonlinear connectome student
on:
  push:
    branches: [main]
    paths:
      - 'src/fly_fruit_fly/nonlinear_training.py'
      - '.github/workflows/nonlinear-student.yml'
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MUJOCO_GL: egl
      OMP_NUM_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa libgl1-mesa-dri ffmpeg
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[superfly,dev]'
          pytest -q tests/test_nonlinear_training.py
      - uses: actions/download-artifact@v4
        with:
          name: nonlinear-connectome-student
          run-id: 34755571903
          github-token: ${{ github.token }}
          path: runs/warm
      - name: Record a previously observed successful connectome flight
        run: |
          superfly evaluate --checkpoint runs/warm/student.pt --graph runs/warm/graph.npz --episodes 1 --seed 80001 --video --output runs/warm-start-success
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          Path('runs/warm-start-success/provenance.json').write_text(json.dumps({
              'source_run':34755571903,'source_artifact':10317556890,
              'checkpoint_sha256':hashlib.sha256(Path('runs/warm/student.pt').read_bytes()).hexdigest(),
              'selection':'Explicitly selected successful seed 80001 from a 5/10 held-out result; demonstration only.'
          },indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: connectome-success-example
          path: runs/warm-start-success
      - name: Train nonlinear decoder and test independently
        run: |
          python -m fly_fruit_fly.nonlinear_training --checkpoint runs/warm/student.pt --graph runs/warm/graph.npz --output runs/nonlinear
          python -m pip freeze > runs/nonlinear/environment.txt
      - name: Apply flight gate
        run: fly assess runs/nonlinear/evaluation/metrics.json --require-pass
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonlinear-connectome-student
          path: runs/nonlinear
          retention-days: 30
