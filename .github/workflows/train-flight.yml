name: Sustained flight experiment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/train-flight.yml']
  workflow_dispatch:
    inputs:
      steps:
        description: Additional training steps from the recorded checkpoint
        default: '65536'
        required: true

permissions:
  contents: read

concurrency:
  group: sustained-flight
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      MUJOCO_GL: egl
      OMP_NUM_THREADS: '2'
      TRAIN_STEPS: ${{ inputs.steps || '65536' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU training stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa libgl1-mesa-dri ffmpeg
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
          python -m pip freeze > environment.txt
          python scripts/verify_results.py
      - name: Learn longer-horizon flight corrections
        run: fly train --resume results/2026-09-12-smoke --steps "$TRAIN_STEPS" --gamma 0.999 --gae-lambda 0.99 --output runs/candidate
      - name: Evaluate baseline and candidate on ten matched held-out phases
        run: |
          fly evaluate --episodes 10 --seed 20000 --output runs/baseline
          fly evaluate --checkpoint runs/candidate --episodes 10 --seed 20000 --video --output runs/evaluation
      - name: Record task acceptance result
        run: |
          fly assess runs/evaluation/metrics.json --baseline runs/baseline/metrics.json > runs/assessment.json
          python -c 'import json; d=json.load(open("runs/assessment.json")); print("Task gate passed:", d["task_gate_passed"]); print(json.dumps(d, indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sustained-flight-${{ github.run_id }}
          path: |
            runs/
            environment.txt
          retention-days: 30
